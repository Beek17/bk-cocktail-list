<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BK's Cocktail List</title>
  <meta name="description" content="A personal, scored cocktail collection.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>BK's Cocktail List</h1>
    <p class="count" id="count" aria-live="polite">Loading…</p>
  </header>

  <main>
    <div class="search-row">
      <label class="sr-only" for="search">Search cocktails</label>
      <input id="search" type="search" placeholder="Search name, ingredient, or note…" autocomplete="off">
    </div>

    <div class="filters">
      <div class="chips" id="spirit-chips" role="group" aria-label="Base spirit"></div>
      <div class="row">
        <label for="min-score">Min score <output id="min-score-out" for="min-score">0</output></label>
        <input id="min-score" type="range" min="0" max="10" step="0.5" value="0">
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="score">Highest score</option>
          <option value="newest">Newest</option>
          <option value="name">A to Z</option>
        </select>
      </div>
    </div>

    <div id="list" class="list"></div>
    <p id="empty" class="empty" hidden>Nothing matches. Loosen a filter.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
