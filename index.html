<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BK's Cocktail List</title>
  <meta name="description" content="A personal, scored cocktail collection.">
  <meta name="referrer" content="no-referrer">
  <!-- Bump ?v= when style.css, api.js or app.js change, so browsers and the CDN never mix old code with new HTML. -->
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1>BK's Cocktail List</h1>
        <p class="count" id="count" aria-live="polite">Loading…</p>
      </div>
      <div class="actions">
        <button id="add-btn" class="btn primary" type="button" hidden>+ Add</button>
        <button id="refresh-btn" class="btn" type="button" hidden>Refresh</button>
        <button id="settings-btn" class="btn" type="button">Settings</button>
      </div>
    </div>
    <p id="banner" class="banner" hidden></p>
  </header>

  <main>
    <div class="search-row">
      <label class="sr-only" for="search">Search cocktails</label>
      <input id="search" type="search" placeholder="Search name, ingredient, or note…" autocomplete="off">
    </div>

    <div class="filters">
      <div class="chips" id="spirit-chips" role="group" aria-label="Base spirit"></div>
      <div class="row">
        <label for="min-score">Min score <output id="min-score-out" for="min-score">0</output></label>
        <input id="min-score" type="range" min="0" max="10" step="0.5" value="0">
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="score">Highest score</option>
          <option value="newest">Newest</option>
          <option value="name">A to Z</option>
        </select>
      </div>
    </div>

    <div id="list" class="list"></div>
    <p id="empty" class="empty" hidden>Nothing matches. Loosen a filter.</p>
  </main>

  <!-- Add / edit -->
  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <form id="edit-form" autocomplete="off">
      <h2 id="edit-title">Edit cocktail</h2>

      <label>Name
        <input name="name" required maxlength="200">
      </label>

      <div class="grid2">
        <label>Score (0 to 10)
          <input name="score" type="number" min="0" max="10" step="0.1" inputmode="decimal">
        </label>
        <label>Base spirit
          <input name="base" list="base-list" maxlength="200">
        </label>
      </div>

      <label>Ingredients <span class="hint">one per line</span>
        <textarea name="ingredients" rows="6"></textarea>
      </label>
      <label>Instructions
        <textarea name="instructions" rows="4"></textarea>
      </label>
      <label>BK's notes
        <textarea name="notes" rows="3"></textarea>
      </label>
      <label>Source
        <input name="source" list="source-list" maxlength="200">
      </label>

      <datalist id="base-list"></datalist>
      <datalist id="source-list"></datalist>

      <p id="edit-error" class="form-error" role="alert" hidden></p>

      <div class="dialog-actions">
        <button type="button" id="delete-btn" class="btn danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" id="edit-cancel" class="btn">Cancel</button>
        <button type="submit" id="edit-save" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Connect to the sheet -->
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form" autocomplete="off">
      <h2 id="settings-title">Connect to your sheet</h2>
      <p class="hint-block">Paste the web app URL from Apps Script and your passcode. Both stay in this browser only.</p>

      <label>Web app URL
        <input name="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" required>
      </label>
      <label>Passcode
        <input name="key" type="password" autocomplete="off" required>
      </label>

      <p id="settings-msg" class="form-error" role="alert" hidden></p>

      <div class="dialog-actions">
        <button type="button" id="disconnect-btn" class="btn danger" hidden>Disconnect</button>
        <span class="spacer"></span>
        <button type="button" id="settings-cancel" class="btn">Close</button>
        <button type="submit" id="settings-save" class="btn primary">Save and connect</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="api.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
